    @if (!yieldFieldCut.deletedByUserInd) {
      <forage-dop-yield-field-cut [yieldField]="yieldField"
        [yieldFieldCut]="yieldFieldCut" [yieldFieldCutsFormArray]="yieldFieldCutsFormArray"
      style="display: contents;"></forage-dop-yield-field-cut>
    }
  </div>
}
