<ng-container>
  @if (underwritingCommentTypeCode == 'DOP') {
    <button mat-raised-button class="secondary header-button" (click)="onLoadComments()">
      <mat-icon class="button-mat-icon" [svgIcon]="hasComments() ? 'insert_comment' : 'mode_comment'"></mat-icon>
      {{ ( insurancePlanId == INSURANCE_PLAN.BERRIES ? "Yield Comments" : "DOP Comments")}}
    </button>
  }
  @if (underwritingCommentTypeCode == 'INV' || underwritingCommentTypeCode == 'VY' ) {
    <span>
      <mat-icon matTooltip="Comments" (click)="onLoadComments()"
      [svgIcon]="hasComments() ? 'insert_comment' : 'mode_comment'"></mat-icon>
    </span>
  }
</ng-container>
