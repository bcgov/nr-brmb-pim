<div class="border-right header border-top border-bottom border-left">Date Created</div>
<div class="border-right header border-top border-bottom">Date Updated</div>
<div class="border-right header border-top border-bottom">Updated By</div>
@if (showForcedCommentsColumn) {
  <div class="border-right header border-top border-bottom">Forced Comment</div>
}
<div class="border-right header border-top border-bottom">Comment</div>
<div class="border-right header justify-center border-top border-bottom">Remove</div>

@for (uwComment of notDeleted(uwComments); track uwComment) {
  <uw-comment [uwComment]="uwComment"
  [uwCommentsFormArray]="uwCommentsFormArray" [showForcedCommentsColumn]="showForcedCommentsColumn"  style="display: contents;"></uw-comment>
}
