kind: ConfigMap
apiVersion: v1
metadata:
  name: cirras-underwriting-listener-api-config-#{ENV}#
  namespace: '#{NAMESPACE}#'
immutable: false
data:
  TOMCAT_PORT: '#{TOMCAT_PORT}#'
  TOMCAT_MAX_THREADS: '#{TOMCAT_MAX_THREADS}#'
  CONNECTION_TIMEOUT: '#{CONNECTION_TIMEOUT}#'
  WEBADE_CHECK_TOKEN_URL: >-
    #{WEBADE_CHECK_API_TOKEN_URL}#
  CIRRAS_UNDERWRITING_API_URL: '#{CIRRAS_UNDERWRITING_API_URL}#'
  POSTGRES_MAXACTIVE: '#{POSTGRES_MAXACTIVE}#'
  WEBADE_USERNAME: '#{WEBADE_USERNAME}#'
  POSTGRES_URL: >-
    jdbc:postgresql://crunchy-postgres-#{ENV}#-pgbouncer.#{NAMESPACE}#.svc.cluster.local/pituw#{ENV}#
  WEBADE_GET_TOKEN_URL: '#{WEBADE_GET_API_TOKEN_URL}#'
  WEBADE_OAUTH2_AUTHORIZE_URL: '#{WEBADE_OAUTH2_AUTHORIZE_URL}#'
  POSTGRES_RESOURCE_NAME: '#{POSTGRES_RESOURCE_NAME}#'
  CIRRAS_UNDERWRITING_SYNC_REST_CLIENT_ID: '#{CIRRAS_UNDERWRITING_SYNC_REST_CLIENT_ID}#'
  WEBADE_MAXACTIVE: '#{WEBADE_MAXACTIVE}#'
  POSTGRES_USERNAME: '#{POSTGRES_USERNAME}#'
  TIME_ZONE: '#{TIME_ZONE}#'
  LOG_LEVEL: '#{LOG_LEVEL}#'
  EMAIL_HOST_NAME: '#{EMAIL_HOST_NAME}#'
  EMAIL_PORT: '#{EMAIL_PORT}#'
  EMAIL_FROM_ADDRESS: '#{EMAIL_FROM_ADDRESS}#'
  MESSAGE_QUEUE_URL: '#{MESSAGE_QUEUE_URL}#'
  EMAIL_UW_LISTENER_SYNCH_ERROR_SUBJECT: '#{EMAIL_UW_LISTENER_SYNCH_ERROR_SUBJECT}#'
  EMAIL_ADMIN_ADDRESS: '#{EMAIL_ADMIN_ADDRESS}#'
  EMAIL_ERROR_SEND_FREQUENCY: '#{EMAIL_ERROR_SEND_FREQUENCY}#'
  APPLICATION_ENVIRONMENT_NAME: '#{ENV}#'