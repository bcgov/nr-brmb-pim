apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: '#{NAMESPACE}#'
  name: 'cirras-underwriting-ui-deployment-#{ENV}#'
spec:
  selector:
    matchLabels:
      app: cirras-underwriting-ui-#{ENV}#
  replicas: 2
  template:
    metadata:
      labels:
        app: cirras-underwriting-ui-#{ENV}#
        project: brmb-pim-#{ENV}#   
    spec:
      serviceAccountName: #{LICENSE_PLATE}#-vault
      containers:
        - name: container
          image: '#{IMAGE_BY_DIGEST}#'
          imagePullPolicy: Always
          ports:
            - containerPort: #{TOMCAT_PORT}#
              protocol: TCP
          env:
            - name: TOMCAT_PORT
              valueFrom: 
                configMapKeyRef:
                  name: cirras-underwriting-ui-config-#{ENV}#
                  key: TOMCAT_PORT
            - name: BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: cirras-underwriting-ui-config-#{ENV}#
                  key: BASE_URL
            - name: CIRRAS_UNDERWRITING_REST_URI
              valueFrom:
                configMapKeyRef:
                  name: cirras-underwriting-ui-config-#{ENV}#
                  key: CIRRAS_UNDERWRITING_REST_URI
            - name: GRAIN_VERIFIED_YIELD_CALCULATOR_URI
              valueFrom:
                configMapKeyRef:
                  name: cirras-underwriting-ui-config-#{ENV}#
                  key: GRAIN_VERIFIED_YIELD_CALCULATOR_URI
            - name: FORAGE_VERIFIED_YIELD_CALCULATOR_URI
              valueFrom:
                configMapKeyRef:
                  name: cirras-underwriting-ui-config-#{ENV}#
                  key: FORAGE_VERIFIED_YIELD_CALCULATOR_URI
            - name: WEBADE_OAUTH2_AUTHORIZE_URL
              valueFrom:
                configMapKeyRef:
                  name: cirras-underwriting-ui-config-#{ENV}#
                  key: WEBADE_OAUTH2_AUTHORIZE_URL
            - name: WEBADE_OAUTH2_ENABLE_CHECKTOKEN
              valueFrom:
                configMapKeyRef:
                  name: cirras-underwriting-ui-config-#{ENV}#
                  key: WEBADE_OAUTH2_ENABLE_CHECKTOKEN
            - name: UI_CHECKTOKEN_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: cirras-underwriting-ui-config-#{ENV}#
                  key: UI_CHECKTOKEN_ENDPOINT
            - name: WEBADE_OAUTH2_SITEMINDER_URL
              valueFrom:
                configMapKeyRef:
                  name: cirras-underwriting-ui-config-#{ENV}#
                  key: WEBADE_OAUTH2_SITEMINDER_URL
            - name: WEBADE_OAUTH2_SCOPES
              valueFrom:
                configMapKeyRef:
                  name: cirras-underwriting-ui-config-#{ENV}#
                  key: WEBADE_OAUTH2_SCOPES
            - name: WEBADE_OAUTH2_SITEMINDER_URL
              valueFrom:
                configMapKeyRef:
                  name: cirras-underwriting-ui-config-#{ENV}#
                  key: WEBADE_OAUTH2_SITEMINDER_URL
            - name: APPLICATION_ENVIRONMENT_NAME      
              value: #{ENV}#
          livenessProbe:
            httpGet:
              scheme: HTTP
              path: /pub/cirras-underwriting/
              port: #{TOMCAT_PORT}#
            initialDelaySeconds: 60
            timeoutSeconds: 5
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 2
          resources:
            requests:
              cpu: 50m
              memory: 200Mi
            limits:
              cpu: 150m
              memory: 400Mi 
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 50%
      maxUnavailable: 50%
